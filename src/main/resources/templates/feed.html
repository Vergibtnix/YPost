<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed | X - Klon</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <div class="container topbar-inner">
        <a class="brand" th:href="@{/feed}">X - Klon</a>
        <nav class="nav-links">
            <a th:href="@{/feed}">Feed</a>
            <a th:href="@{/users/{username}(username=${currentUsername})}">Mein Profil</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-secondary btn-small">Logout</button>
            </form>
            <button id="darkToggle" class="btn btn-secondary btn-small">🌙</button>
        </nav>
    </div>
</header>

<main class="container page-grid">
    <section class="card composer">
        <h1>Hallo, <span th:text="${currentUsername}"></span> 👋</h1>
        <p class="subtitle">Erstelle einen neuen Post mit maximal 420 Zeichen.</p>

        <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

        <form th:action="@{/feed(sort=${sort})}" th:object="${postForm}" method="post" class="stack gap-md">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="field">
                <span>Dein Post</span>
                <textarea th:field="*{content}" rows="4" maxlength="420" placeholder="Was möchtest du teilen?"></textarea>
                <small class="error-text" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></small>
            </label>
            <button type="submit" class="btn btn-primary">Post veröffentlichen</button>
        </form>
    </section>

    <section class="feed-section">
        <div class="feed-header">
            <div>
                <h2>Feed</h2>
                <p class="muted">Alle Posts aller Benutzer</p>
            </div>

            <form th:action="@{/feed/search}" method="get" class="search-box">
                <input type="text" name="q" placeholder="User suchen...">
            </form>


            <div class="sort-switch">
                <a th:href="@{/feed(sort='newest')}" th:classappend="${sort == 'newest'} ? ' active' : ''">Neueste zuerst</a>
                <a th:href="@{/feed(sort='likes')}" th:classappend="${sort == 'likes'} ? ' active' : ''">Meiste Likes</a>
            </div>
        </div>

        <div class="post-list" th:if="${!#lists.isEmpty(posts)}">
            <article class="card post-card" th:each="post : ${posts}">
                <div class="post-meta">
                    <a class="user-link" th:href="@{/users/{username}(username=${post.authorUsername})}" th:text="${post.authorUsername}"></a>
                    <span th:text="${#temporals.format(post.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
                </div>

                <p class="post-content" th:text="${post.content}"></p>

                <div class="post-actions">

                    <!-- Reaction Badges (Like + Dislike nebeneinander) -->
                    <div class="reaction-badges">
                        <span class="like-badge">👍 <span th:text="${post.likeCount}"></span></span>
                        <span class="dislike-badge">👎 <span th:text="${post.dislikeCount}"></span></span>
                    </div>

                    <!-- Like -->
                    <form th:action="@{/posts/{id}/like(id=${post.id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="redirect" th:value="@{/feed(sort=${sort})}">
                        <button type="submit" class="btn btn-like">
                            <span th:if="${post.likedByCurrentUser}">👍 </span>
                            <span th:if="${!post.likedByCurrentUser}">👍 </span>
                        </button>
                    </form>

                    <!-- Dislike -->
                    <form th:action="@{/posts/{id}/dislike(id=${post.id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="redirect" th:value="@{/feed(sort=${sort})}">
                        <button type="submit" class="btn btn-dislike">
                            <span th:if="${post.dislikedByCurrentUser}">👎</span>
                            <span th:if="${!post.dislikedByCurrentUser}">👎 </span>
                        </button>
                    </form>

                    <!-- Delete Button -->
                    <form th:if="${post.ownPost}"
                          th:action="@{/feed/{postId}/delete(postId=${post.id})}"
                          method="post"
                          style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="sort" th:value="${sort}">
                        <button type="submit" class="btn btn-delete"
                                onclick="return confirm('Willst du diesen Post wirklich löschen?');">
                            🗑️
                        </button>
                    </form>

                </div>
            </article>
        </div>

        <div class="card empty-state" th:if="${#lists.isEmpty(posts)}">
            Noch keine Posts vorhanden.
        </div>
    </section>
    <div class="pagination">

        <a th:if="${currentPage > 0}"
           th:href="@{/feed(page=${currentPage - 1}, size=10)}"
           class="page-btn">← Zurück</a>

        <span class="page-info">
        Seite <span th:text="${currentPage + 1}"></span>
        von <span th:text="${totalPages}"></span>
    </span>

        <a th:if="${currentPage + 1 < totalPages}"
           th:href="@{/feed(page=${currentPage + 1}, size=10)}"
           class="page-btn">Weiter →</a>

    </div>

</main>
<script>
    const toggle = document.getElementById("darkToggle");

    // Dark Mode Zustand aus LocalStorage laden
    if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark");
    }

    toggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        localStorage.setItem("darkMode", document.body.classList.contains("dark"));
    });
</script>

</body>
</html>
