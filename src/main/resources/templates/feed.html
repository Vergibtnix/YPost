<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed | yPosts</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <div class="container topbar-inner">
        <a class="brand" th:href="@{/feed}">yPosts</a>
        <nav class="nav-links">
            <a th:href="@{/feed}">Feed</a>
            <a th:href="@{/users/{username}(username=${currentUsername})}">Mein Profil</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-secondary btn-small">Logout</button>
            </form>
        </nav>
    </div>
</header>

<main class="container page-grid">
    <section class="card composer">
        <h1>Hallo, <span th:text="${currentUsername}"></span> 👋</h1>
        <p class="subtitle">Erstelle einen neuen Post mit maximal 420 Zeichen.</p>

        <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

        <form th:action="@{/feed(sort=${sort})}" th:object="${postForm}" method="post" class="stack gap-md">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="field">
                <span>Dein Post</span>
                <textarea th:field="*{content}" rows="4" maxlength="420" placeholder="Was möchtest du teilen?"></textarea>
                <small class="error-text" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></small>
            </label>
            <button type="submit" class="btn btn-primary">Post veröffentlichen</button>
        </form>
    </section>

    <section class="feed-section">
        <div class="feed-header">
            <div>
                <h2>Feed</h2>
                <p class="muted">Alle Posts aller Benutzer</p>
            </div>
            <div class="sort-switch">
                <a th:href="@{/feed(sort='newest')}" th:classappend="${sort == 'newest'} ? ' active' : ''">Neueste zuerst</a>
                <a th:href="@{/feed(sort='likes')}" th:classappend="${sort == 'likes'} ? ' active' : ''">Meiste Likes</a>
            </div>
        </div>

        <div class="post-list" th:if="${!#lists.isEmpty(posts)}">
            <article class="card post-card" th:each="post : ${posts}">
                <div class="post-meta">
                    <a class="user-link" th:href="@{/users/{username}(username=${post.authorUsername})}" th:text="${post.authorUsername}"></a>
                    <span th:text="${#temporals.format(post.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
                </div>
                <p class="post-content" th:text="${post.content}"></p>
                <div class="post-actions">
                    <span class="like-badge">❤️ <span th:text="${post.likeCount}"></span></span>
                    <form th:if="${!post.ownPost}" th:action="@{/posts/{postId}/like(postId=${post.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="redirect" th:value="@{/feed(sort=${sort})}">
                        <button type="submit" class="btn btn-like" th:text="${post.likedByCurrentUser} ? 'Unlike' : 'Like'"></button>
                    </form>
                    <span class="own-post-label" th:if="${post.ownPost}">Dein Post</span>
                </div>
            </article>
        </div>

        <div class="card empty-state" th:if="${#lists.isEmpty(posts)}">
            Noch keine Posts vorhanden.
        </div>
    </section>
</main>
</body>
</html>
