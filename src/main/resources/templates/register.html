<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren | yPosts</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="login-page">

<!-- 🌙 Dark Mode Button oben rechts -->
<button id="darkToggle" class="dark-toggle">🌙</button>

<div class="login-card">

    <h1>Konto erstellen</h1>
    <p class="subtitle">Registriere dich mit eindeutigem Benutzernamen und E-Mail-Adresse.</p>

    <!-- Globale Fehler -->
    <div class="alert error"
         th:if="${#fields.hasGlobalErrors()}"
         th:each="err : ${#fields.globalErrors()}"
         th:text="${err}">
    </div>

    <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="stack gap-md">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label class="field">
            <span>Benutzername</span>
            <input type="text" th:field="*{username}" autocomplete="username" required>
            <small class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
        </label>

        <label class="field">
            <span>E-Mail</span>
            <input type="email" th:field="*{email}" autocomplete="email" required>
            <small class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
        </label>

        <label class="field">
            <span>Passwort</span>
            <input type="password" th:field="*{password}" autocomplete="new-password" required>
            <small class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
        </label>

        <label class="field">
            <span>Passwort bestätigen</span>
            <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
            <small class="error-text" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
            <small class="error-text" th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}"></small>
        </label>

        <label class="field">
            <span>Profilbeschreibung (optional)</span>
            <textarea th:field="*{bio}" rows="4" maxlength="500"></textarea>
            <small class="error-text" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}"></small>
        </label>

        <button type="submit" class="btn btn-primary">Registrieren</button>
    </form>

    <p class="muted center margin-top-lg">
        Bereits registriert?
        <a th:href="@{/login}">Zum Login</a>
    </p>

    <div class="demo-box">
        <strong>Demo-Logins nach dem ersten Start:</strong>
        <ul>
            <li><code>alice</code> / <code>Password123!</code></li>
            <li><code>bob</code> / <code>Password123!</code></li>
        </ul>
    </div>

</div>

<script>
    const toggle = document.getElementById("darkToggle");

    if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark");
    }

    if (toggle) {
        toggle.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            localStorage.setItem("darkMode", document.body.classList.contains("dark"));
        });
    }
</script>

</body>
</html>
